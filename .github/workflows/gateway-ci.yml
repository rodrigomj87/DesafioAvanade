name: gateway-ci

on:
  push:
    branches: ["main"]
    paths:
      - "src/ApiGateway/**"
      - ".github/workflows/gateway-ci.yml"
      - "Docs/**"
  pull_request:
    branches: ["main"]
    paths:
      - "src/ApiGateway/**"
      - ".github/workflows/gateway-ci.yml"
      - "Docs/**"

env:
  DOTNET_NOLOGO: true

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/ApiGateway/ApiGateway.csproj

      - name: Build
        run: dotnet build src/ApiGateway/ApiGateway.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test src/ApiGateway/ApiGateway.csproj --configuration Release --no-build --verbosity normal
